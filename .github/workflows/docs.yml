# this_file: .github/workflows/docs.yml
# Rebuild the documentation site into docs/ on every push to the default branch.
# GitHub Pages serves docs/ at https://vexy.dev/vexy-marktripy/.
name: Docs
on:
  push:
    branches: [master]
    paths:
      - "src_docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build documentation
        run: bash src_docs/build.sh
      - name: Commit rebuilt docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then echo "docs/ unchanged"; exit 0; fi
          git commit -m "docs: rebuild site [skip ci]"
          git pull --rebase
          git push
