# this_file: src_docs/mkdocs.yml
site_name: vexy-marktripy
site_description: A Python package for converting Markdown to AST and back to Markdown
site_url: https://vexy.dev/vexy-marktripy/
repo_url: https://github.com/vexyart/vexy-marktripy
repo_name: vexyart/vexy-marktripy
edit_uri: edit/master/src_docs/md/
docs_dir: md
site_dir: ../docs
use_directory_urls: true
theme:
  name: materialx
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-4, name: Switch to light mode}
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
plugins:
  - search
nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quickstart: quickstart.md
  - User guide:
      - The AST: ast.md
      - Parsers: parsers.md
      - Renderers: renderers.md
      - Transformers: transformers.md
      - Extensions: extensions.md
      - Validation and utilities: validation.md
  - Reference:
      - API reference: api.md
      - Architecture: architecture.md
      - Known limitations: limitations.md
      - Contributing: contributing.md
